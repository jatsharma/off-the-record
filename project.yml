name: NotesApp
options:
  bundleIdPrefix: io.jatsharma
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
packages:
  FluidAudio:
    path: Vendor/FluidAudio
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.12.0
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 1.1.1
targets:
  NotesApp:
    type: application
    platform: macOS
    sources:
      - path: NotesApp
        excludes:
          - "Resources/*.plist"
          - "Resources/*.entitlements"
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: GRDB
        product: GRDB
      - package: WhisperKit
        product: WhisperKit
    info:
      path: NotesApp/Resources/Info.plist
      properties:
        CFBundleName: Off the Record
        CFBundleDisplayName: Off the Record
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Off the Record transcribes your side of the meeting. Audio never leaves this Mac.
        NSAudioCaptureUsageDescription: Off the Record transcribes the other side of your call from system audio. Audio never leaves this Mac.
        NSHumanReadableCopyright: Local only.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.jatsharma.offtherecord
        PRODUCT_NAME: Off the Record
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        # On for every build: without it any program can load its own code into the app
        # (DYLD_INSERT_LIBRARIES) and use the app's microphone, system-audio and screen permissions.
        ENABLE_HARDENED_RUNTIME: YES
        # Stable identity so macOS keeps the microphone and system-audio permissions across
        # builds and updates (ad-hoc "-" changes on every build). `make` passes the best one
        # available: "Off the Record" (scripts/make-signing-cert.sh), a Developer ID, or ad-hoc.
        CODE_SIGN_IDENTITY: "$(OTR_SIGN_ID:default=Off the Record)"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        # Apple Silicon only (the speech models run on the Neural Engine).
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
      # Entitlements per configuration (XcodeGen's `entitlements:` key would override these):
      # Release NotesApp.entitlements, Debug NotesApp-Debug.entitlements.
      configs:
        Debug:
          # Debug builds load Xcode's debug dylib and the ad-hoc signed test bundle, which library
          # validation would reject (no Team ID). Release has no libraries of its own and keeps it on.
          CODE_SIGN_ENTITLEMENTS: NotesApp/Resources/NotesApp-Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: NotesApp/Resources/NotesApp.entitlements
          # No get-task-allow in Release: it lets a debugger attach to the app and would let
          # DYLD_* variables through the hardened runtime. Debug keeps it (Xcode, unit tests).
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme:
      testTargets:
        - NotesAppTests
  NotesAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/NotesAppTests
    dependencies:
      - target: NotesApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.jatsharma.offtherecord.tests
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Off the Record.app/Contents/MacOS/Off the Record"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # Loaded into the app, which has library validation off; ad-hoc is enough.
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
