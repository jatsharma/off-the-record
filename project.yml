name: NotesApp
options:
  bundleIdPrefix: io.stackera
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
packages:
  FluidAudio:
    path: Vendor/FluidAudio
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.12.0
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 1.1.1
targets:
  NotesApp:
    type: application
    platform: macOS
    sources:
      - path: NotesApp
        excludes:
          - "Resources/*.plist"
          - "Resources/*.entitlements"
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: GRDB
        product: GRDB
      - package: WhisperKit
        product: WhisperKit
    info:
      path: NotesApp/Resources/Info.plist
      properties:
        CFBundleName: Off the Record
        CFBundleDisplayName: Off the Record
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Off the Record transcribes your side of the meeting. Audio never leaves this Mac.
        NSAudioCaptureUsageDescription: Off the Record transcribes the other side of your call from system audio. Audio never leaves this Mac.
        NSHumanReadableCopyright: Local only.
    entitlements:
      path: NotesApp/Resources/NotesApp.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.stackera.offtherecord
        PRODUCT_NAME: Off the Record
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        # Off: hardened-runtime library validation rejects our own dylibs when the
        # signing certificate has no Team ID (self-signed local identity). Turn it
        # on again only for a Developer ID + notarized build.
        ENABLE_HARDENED_RUNTIME: "$(OTR_HARDENED:default=NO)"
        # Stable identity so macOS keeps the microphone and system-audio permissions across
        # builds and updates (ad-hoc "-" changes on every build). `make` passes the best one
        # available: "Off the Record" (scripts/make-signing-cert.sh), a Developer ID, or ad-hoc.
        CODE_SIGN_IDENTITY: "$(OTR_SIGN_ID:default=Off the Record)"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - NotesAppTests
  NotesAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/NotesAppTests
    dependencies:
      - target: NotesApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.stackera.offtherecord.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Off the Record.app/Contents/MacOS/Off the Record"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # Loaded into the app, which has library validation off; ad-hoc is enough.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
