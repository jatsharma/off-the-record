name: NotesApp
options:
  bundleIdPrefix: io.stackera
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
packages:
  FluidAudio:
    path: Vendor/FluidAudio
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.12.0
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 1.1.1
targets:
  NotesApp:
    type: application
    platform: macOS
    sources:
      - path: NotesApp
        excludes:
          - "Resources/*.plist"
          - "Resources/*.entitlements"
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: GRDB
        product: GRDB
      - package: WhisperKit
        product: WhisperKit
    info:
      path: NotesApp/Resources/Info.plist
      properties:
        CFBundleName: Meeting Notes
        CFBundleDisplayName: Meeting Notes
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Notes records your side of the meeting. Audio never leaves this Mac.
        NSAudioCaptureUsageDescription: Notes records the other side of your call from system audio. Audio never leaves this Mac.
        NSHumanReadableCopyright: Local only.
    entitlements:
      path: NotesApp/Resources/NotesApp.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.stackera.notes
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        # Off: hardened-runtime library validation rejects our own dylibs when the
        # signing certificate has no Team ID (self-signed local identity). Turn it
        # on again only for a Developer ID + notarized build.
        ENABLE_HARDENED_RUNTIME: NO
        # Stable local identity so macOS keeps the system-audio permission across
        # rebuilds (ad-hoc "-" changes on every build). Create it with
        # scripts/make-dev-cert.sh, or set your Apple Development identity here.
        CODE_SIGN_IDENTITY: "Meeting Notes Dev"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
